name: Release

# release-please lit les commits conventionnels (feat:, fix:…) et tient à jour une PR "chore: release".
# Quand tu merges cette PR : le numéro de version augmente, CHANGELOG.md est mis à jour et une release GitHub est créée.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # "node" : la version est lue et mise à jour dans package.json.
          release-type: node
